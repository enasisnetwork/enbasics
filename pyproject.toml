


[project]

name = "enbasics"
description = "Enasis Network Project Basics"

readme = "README.md"

license.text = "MIT"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"]

requires-python = ">= 3.11"

dynamic = ["version", "dependencies"]



[project.urls]

Source = "https://github.com/enasisnetwork/enbasics"
Documentation = "https://enasisnetwork.github.io/enbasics/sphinx"



[tool.setuptools.dynamic]

version.attr = "enbasics.__version__"

dependencies.file = ["require/install.txt"]



[tool.setuptools.packages.find]

include = ["enbasics", "enbasics.*"]



[tool.ruff.lint]

ignore = [
  "I001",    # flake8 handles imports
  "RUF100",  # we use noqa for flake8
  "UP045",   # still allow Optional
  "UP007",   # still allow Union
  "RUF022",  # drives order in docs
  "BLE001"]  # allow blind exception



[project.optional-dependencies]

badges = [
  "python-dateutil",
  "wand",
  "weasyprint"]
